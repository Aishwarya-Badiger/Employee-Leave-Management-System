<!DOCTYPE html>
<html>
<head>
    <title>Login - ELMS</title>

    <style>
        body{
    margin:0;
    padding:0;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Segoe UI',sans-serif;

    background:url("/static/bg.jpg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;
}

        .login-box {
            background: white;
            padding: 40px;
            width: 320px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #2c3e50;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            border: none;
            color: white;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #2980b9;
        }

        .footer {
            margin-top: 15px;
            font-size: 12px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Employee Login</h2>

    <form action="/login" method="POST">

        <input type="text" name="pf_no" placeholder="PF Number" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>
        <br>

<a href="/forgot_password">
    Forgot Password?
</a>
    </form>

    <div class="footer">
        Employee Leave Management System
    </div>
</div>

</body>
</html>
