<!DOCTYPE html>
<html>
<head>
    <title>Add Employee</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            width:100%;
            max-width:450px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            color:#2c3e50;
            margin-bottom:25px;
        }

        .success-msg{
            background:#2ecc71;
            color:white;
            padding:12px;
            border-radius:8px;
            text-align:center;
            margin-bottom:20px;
            font-weight:bold;
        }

        label{
            display:block;
            margin-bottom:8px;
            color:#2c3e50;
            font-weight:600;
        }

        input,
        select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:18px;
            font-size:14px;
            transition:0.3s;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#3498db;
            box-shadow:0 0 5px rgba(52,152,219,0.3);
        }

        button{
            width:100%;
            background:#1abc9c;
            color:white;
            border:none;
            padding:13px;
            border-radius:8px;
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#16a085;
        }

        .back-btn{
            display:block;
            text-align:center;
            margin-top:18px;
            text-decoration:none;
            background:#34495e;
            color:white;
            padding:12px;
            border-radius:8px;
            transition:0.3s;
        }

        .back-btn:hover{
            background:#2c3e50;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Add New Employee</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="success-msg">
                {{ messages[0] }}
            </div>
        {% endif %}
    {% endwith %}

    <form action="/save_employee" method="POST">

        <label>PF Number</label>
        <input type="text" name="pf_no" required>

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Branch</label>
        <input type="text" name="branch" required>

        <label>Role</label>

        <select name="role">

    <option value="employee">
        Employee
    </option>

    <option value="manager">
        Manager
    </option>

    <option value="admin">
        Admin
    </option>

</select>

        <button type="submit">
            Add Employee
        </button>

    </form>

    <a href="/manager_dashboard" class="back-btn">
        ⬅ Back to Dashboard
    </a>

</div>

</body>
</html>
