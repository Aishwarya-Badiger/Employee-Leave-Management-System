<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f4f6f9;
            font-family:'Segoe UI',sans-serif;
        }

        .container{
            width:380px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        .title{
            text-align:center;
            color:#2c3e50;
            margin-bottom:25px;
            font-size:28px;
            font-weight:bold;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-group label{
            display:block;
            margin-bottom:7px;
            color:#34495e;
            font-weight:600;
        }

        .input-group input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:14px;
            transition:0.3s;
        }

        .input-group input:focus{
            outline:none;
            border-color:#3498db;
            box-shadow:0 0 5px rgba(52,152,219,0.3);
        }

        .reset-btn{
            width:100%;
            padding:12px;
            background:#3498db;
            color:white;
            border:none;
            border-radius:8px;
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .reset-btn:hover{
            background:#2980b9;
        }

        .back-link{
            display:block;
            text-align:center;
            margin-top:18px;
            text-decoration:none;
            color:#3498db;
            font-size:14px;
            font-weight:600;
        }

        .back-link:hover{
            text-decoration:underline;
        }

        .message{
            background:#2ecc71;
            color:white;
            padding:10px;
            border-radius:7px;
            margin-bottom:18px;
            text-align:center;
            font-weight:bold;
        }

        @media(max-width:450px){

            .container{
                width:90%;
                padding:25px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">
            Forgot Password
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}

                <div class="message">
                    {{ messages[0] }}
                </div>

            {% endif %}
        {% endwith %}

        <form action="/reset_password"
              method="POST">

            <div class="input-group">

                <label>PF Number</label>

                <input type="text"
                       name="pf_no"
                       placeholder="Enter PF Number"
                       required>

            </div>

            <div class="input-group">

                <label>New Password</label>

                <input type="password"
                       name="new_password"
                       placeholder="Enter New Password"
                       required>

            </div>

            <button type="submit"
                    class="reset-btn">

                Reset Password

            </button>

        </form>

        <a href="/"
           class="back-link">

            ⬅ Back To Login

        </a>

    </div>

</body>

</html>
